# Battle-tested style security checks on push/PR.
# Secrets: gitleaks + trufflehog (both).
# Code/deps: bandit + pip-audit.
# Least privilege: contents read only unless a job needs more.

name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Official action; v3 = Node 24 runtime (v2 goes stale mid-2026).
      # GITLEAKS_LICENSE only needed for GitHub Organizations.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Official TruffleHog OSS action. verified+unknown results.
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit==1.9.4"
      - name: Run bandit
        run: bandit -r . -x ./.venv,./.git -ll

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"
      - name: Audit requirements
        run: |
          if [ -s requirements.txt ]; then
            pip-audit -r requirements.txt --strict --desc
          else
            echo "requirements.txt empty or missing; skip until pins exist"
            exit 1
          fi
