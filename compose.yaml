# App + Redis. No top-level version key (Compose Spec).
# API key / Redis password stay out of the image: pass via host env or .env.
# Startup order: https://docs.docker.com/compose/how-tos/startup-order/
# Redis auth + AOF: https://redis.io/tutorials/operate/orchestration/docker/
# Resource limits (Compose V2+ applies deploy.resources on compose up):
# https://docs.docker.com/reference/compose-file/deploy/#resources

services:
  redis:
    image: redis:7.2.5-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    environment:
      # Lets `redis-cli ping` auth without -a on the CLI (safer healthcheck).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
    restart: unless-stopped

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M
    restart: unless-stopped

volumes:
  redis-data:
