# Reverse proxy in front of gunicorn (api:5000).
# Pass X-Forwarded-* so Flask ProxyFix can recover the client view.
# https://flask.palletsprojects.com/en/stable/deploying/proxy_fix/

upstream api_upstream {
    server api:5000;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ready {
        proxy_pass http://api_upstream/ready;
        access_log off;
    }
}
